name: 기능 제안
description: StoryOps를 개선할 아이디어를 제안해 주세요.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 불편하거나 어려운지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방식
      description: 기대하는 사용 흐름이나 결과를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 이미 시도했거나 고려한 다른 방법이 있다면 적어 주세요.
  - type: checkboxes
    id: scope
    attributes:
      label: 공개 데이터 확인
      options:
        - label: 제안 내용에 실제 원고, 개인 정보, API 키나 자격 증명을 포함하지 않았습니다.
          required: true
